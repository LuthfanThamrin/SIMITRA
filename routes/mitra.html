    <!-- TopNavBar -->

            <span class="font-headline-md text-primary tracking-tight">SIMITRA&nbsp;</span>
        </div>
        
        <!-- Navigation Links (Desktop) -->
        <nav class="hidden md:flex items-center gap-8">
            <a href="#" class="font-label-md text-secondary hover:text-primary transition-colors">Beranda</a>
            <a href="#" class="font-label-md text-primary-container border-b-2 border-primary-container pb-1">Benefit</a>
            <a href="#" class="font-label-md text-secondary hover:text-primary transition-colors">Bantuan</a>
        </nav>

        <div class="flex items-center gap-4">
            <button class="bg-primary-container text-on-primary font-bold py-2 px-6 rounded-lg hover:brightness-90 transition-all active:scale-95 text-label-md">
                Masuk Portal
            </button>
        </div>
    </header>

        <div class="w-full max-w-2xl">
            <!-- Header Text -->
            <div class="text-center mb-10">
                <h1 class="font-headline-xl text-primary lowercase mb-2">pendaftaran mitra baru</h1>
                <p class="font-body-lg text-on-surface-variant max-w-md mx-auto">
                    Bergabunglah bersama ekosistem SIMITRA INDIBIZ dan kembangkan potensi bisnis Anda melalui kolaborasi profesional.
                </p>
            </div>

            <!-- Registration Card -->
            <div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-8 md:p-12 shadow-sm relative overflow-hidden">
                <!-- Visual Accent -->
                <div class="absolute top-0 right-0 w-32 h-32 bg-primary/5 rounded-full -mr-16 -mt-16"></div>
                
                <form class="space-y-6 relative z-10" onsubmit="event.preventDefault(); alert('Pendaftaran dikirim!');">
                    <!-- Row 1: Nama Lengkap & Alamat Email -->
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div class="space-y-2">
                            <label for="full_name" class="font-label-md text-on-surface-variant flex items-center gap-2">
                                <span class="material-symbols-outlined text-sm">person</span>
                                Nama Lengkap
                            </label>
                            <input type="text" id="full_name" placeholder="Masukkan nama sesuai KTP" required="" class="w-full px-4 py-3 rounded-lg border border-outline focus:ring-2 focus:ring-primary-container focus:border-primary-container bg-surface outline-none transition-all placeholder:text-outline-variant">
                        </div>
                        <div class="space-y-2">
                            <label for="email" class="font-label-md text-on-surface-variant flex items-center gap-2">
                                <span class="material-symbols-outlined text-sm">mail</span>
                                Alamat Email
                            </label>
                            <input type="email" id="email" placeholder="contoh@domain.com" required="" class="w-full px-4 py-3 rounded-lg border border-outline focus:ring-2 focus:ring-primary-container focus:border-primary-container bg-surface outline-none transition-all placeholder:text-outline-variant">
                        </div>
                    </div>

                    <!-- Row 2: Alamat Lengkap -->
                    <div class="space-y-2">
                        <label for="address" class="font-label-md text-on-surface-variant flex items-center gap-2">
                            <span class="material-symbols-outlined text-sm">location_on</span>
                            Alamat Lengkap
                        </label>
                        <textarea id="address" rows="3" placeholder="Masukkan alamat lengkap domisili" required="" class="w-full px-4 py-3 rounded-lg border border-outline focus:ring-2 focus:ring-primary-container focus:border-primary-container bg-surface outline-none transition-all placeholder:text-outline-variant"></textarea>
                    </div>

                    <!-- Row 3: Bank Info (Split) -->
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div class="space-y-2">
                            <label for="bank_name" class="font-label-md text-on-surface-variant flex items-center gap-2">
                                <span class="material-symbols-outlined text-sm">account_balance</span>
                                Nama Bank
                            </label>
                            <input type="text" id="bank_name" placeholder="Contoh: Bank Mandiri" required="" class="w-full px-4 py-3 rounded-lg border border-outline focus:ring-2 focus:ring-primary-container focus:border-primary-container bg-surface outline-none transition-all placeholder:text-outline-variant">
                        </div>
                        <div class="space-y-2">
                            <label for="bank_account" class="font-label-md text-on-surface-variant flex items-center gap-2">
                                <span class="material-symbols-outlined text-sm">payments</span>
                                Nomor Rekening
                            </label>
                            <input type="text" id="bank_account" placeholder="Contoh: 1234567890" required="" class="w-full px-4 py-3 rounded-lg border border-outline focus:ring-2 focus:ring-primary-container focus:border-primary-container bg-surface outline-none transition-all placeholder:text-outline-variant">
                        </div>
                    </div>

                    <!-- Row 4:-->
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div class="space-y-2">
                            <label for="password" class="font-label-md text-on-surface-variant flex items-center gap-2">
                                <span class="material-symbols-outlined text-sm">lock</span>
                                Kata Sandi
                            </label>
                            <div class="relative">
                                <input type="password" id="password" placeholder="••••••••" required="" class="w-full px-4 py-3 rounded-lg border border-outline focus:ring-2 focus:ring-primary-container focus:border-primary-container bg-surface outline-none transition-all pr-12">
                                <button type="button" class="absolute right-3 top-1/2 -translate-y-1/2 text-outline-variant hover:text-primary-container transition-colors">
                                    <span class="material-symbols-outlined">visibility</span>
                                </button>
                            </div>
                        </div>
                        <div class="space-y-2">
                            <label for="confirm_password" class="font-label-md text-on-surface-variant flex items-center gap-2">
                                <span class="material-symbols-outlined text-sm">verified_user</span>
                                Konfirmasi Kata Sandi
                            </label>
                            <div class="relative">
                                <input type="password" id="confirm_password" placeholder="••••••••" required="" class="w-full px-4 py-3 rounded-lg border border-outline focus:ring-2 focus:ring-primary-container focus:border-primary-container bg-surface outline-none transition-all pr-12">
                                <button type="button" class="absolute right-3 top-1/2 -translate-y-1/2 text-outline-variant hover:text-primary-container transition-colors">
                                    <span class="material-symbols-outlined">visibility</span>
                                </button>
                            </div>
                        </div>
                    </div>

                    <!-- Syarat & Ketentuan -->
                    <div class="flex items-start gap-3 py-2">
                        <input type="checkbox" id="terms" required="" class="mt-1 h-4 w-4 text-primary-container border-outline-variant rounded focus:ring-primary-container">
                        <label for="terms" class="text-label-md text-on-surface-variant leading-tight">
                            Saya menyetujui <a href="#" class="text-primary-container font-bold hover:underline">Syarat &amp; Ketentuan</a> serta <a href="#" class="text-primary-container font-bold hover:underline">Kebijakan Privasi</a> yang berlaku di SIMITRA.
                        </label>
                    </div>

                    <!-- Submit Button -->
                    </form></div></div></main></body></html>
